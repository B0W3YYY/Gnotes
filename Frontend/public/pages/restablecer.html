<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body data-base="../" data-roles="visitante">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card tarjeta p-4">
                    <h1 class="h3 text-center mb-4">Crear contraseña nueva</h1>

                    <div id="alerta" aria-live="polite"></div>

                    <form id="formRestablecer" novalidate>
                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña nueva</label>
                            <input type="password" class="form-control" id="clave" autocomplete="new-password" required minlength="6">
                            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmar" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmar" autocomplete="new-password" required>
                            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Guardar contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/recuperar.js"></script>
</body>

</html>
