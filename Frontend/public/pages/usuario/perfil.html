<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Mi perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/styles.css" rel="stylesheet">
</head>

<body data-base="../../" data-roles="usuario,moderador,admin">

    <main class="container py-5">
        <h1 class="mb-4">Mi perfil</h1>
        <div id="alerta" aria-live="polite"></div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card tarjeta p-4 text-center">
                    <div id="inicial" class="avatar mx-auto mb-3" aria-hidden="true"></div>
                    <h2 id="verNombre" class="h4 mb-1"></h2>
                    <p id="verCorreo" class="text-muted mb-2"></p>
                    <p><span id="verRol" class="badge bg-secondary"></span></p>
                    <p id="verBiografia" class="small"></p>
                    <small class="text-muted">Miembro desde <span id="verDesde"></span></small>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card tarjeta p-4 mb-4">
                    <h2 class="h5 mb-3">Editar datos</h2>
                    <form id="formPerfil" novalidate>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" required minlength="3" maxlength="40">
                                <div class="invalid-feedback">Mínimo 3 letras.</div>
                            </div>
                            <div class="col-sm-6">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" class="form-control" required>
                                <div class="invalid-feedback">Escribe un correo válido.</div>
                            </div>
                            <div class="col-12">
                                <label for="biografia" class="form-label">Sobre mí</label>
                                <textarea id="biografia" class="form-control" rows="3" maxlength="300" placeholder="Tus juegos favoritos, tu estilo de juego..."></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primario mt-3">Guardar cambios</button>
                    </form>
                </div>

                <div class="card tarjeta p-4 mb-4">
                    <h2 class="h5 mb-3">Cambiar contraseña</h2>
                    <div id="alertaClave" aria-live="polite"></div>
                    <form id="formClave" novalidate>
                        <div class="row g-3">
                            <div class="col-sm-4">
                                <label for="claveActual" class="form-label">Actual</label>
                                <input type="password" id="claveActual" class="form-control" autocomplete="current-password" required>
                            </div>
                            <div class="col-sm-4">
                                <label for="claveNueva" class="form-label">Nueva</label>
                                <input type="password" id="claveNueva" class="form-control" autocomplete="new-password" required minlength="6">
                                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                            </div>
                            <div class="col-sm-4">
                                <label for="claveConfirmar" class="form-label">Confirmar</label>
                                <input type="password" id="claveConfirmar" class="form-control" autocomplete="new-password" required>
                                <div class="invalid-feedback">No coinciden.</div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary mt-3">Cambiar contraseña</button>
                    </form>
                </div>

                <div class="card tarjeta p-4 border border-danger">
                    <h2 class="h5 text-danger mb-2">Eliminar cuenta</h2>
                    <p class="small text-muted">Se borrarán tu cuenta, tus guías y tus comentarios para siempre.</p>
                    <div id="alertaEliminar" aria-live="polite"></div>
                    <form id="formEliminar" class="row g-2 align-items-end" novalidate>
                        <div class="col-sm-8">
                            <label for="claveEliminar" class="form-label">Confirma con tu contraseña</label>
                            <input type="password" id="claveEliminar" class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="col-sm-4">
                            <button type="submit" class="btn btn-danger w-100">Eliminar cuenta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/guias-comun.js"></script>
    <script src="../../js/perfil.js"></script>
</body>

</html>
