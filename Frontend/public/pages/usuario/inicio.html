<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Mi panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/styles.css" rel="stylesheet">
</head>

<body data-base="../../" data-roles="usuario,moderador,admin">

    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="mb-1">Mi panel</h1>
                <p id="saludo" class="lead mb-0"></p>
            </div>
            <a href="guia-form.html" class="btn btn-primario">+ Crear guía</a>
        </div>

        <div id="alerta" aria-live="polite"></div>

        <div id="estadisticas" class="row g-3 mb-5"></div>

        <h2 class="h4 mb-3">Historial de contribuciones</h2>
        <p id="sinGuias" class="text-muted d-none">Todavía no has creado guías. <a href="guia-form.html">¡Crea la primera!</a></p>
        <div id="tablaHistorial" class="table-responsive d-none">
            <table class="table bg-white align-middle tarjeta overflow-hidden">
                <thead class="table-light">
                    <tr><th>Guía</th><th>Estado</th><th class="text-center">Votos</th><th class="text-center">Vistas</th><th>Fecha</th><th></th></tr>
                </thead>
                <tbody id="historial"></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/guias-comun.js"></script>
    <script src="../../js/dashboard.js"></script>
</body>

</html>
