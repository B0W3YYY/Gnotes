<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Guía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link href="../../css/styles.css" rel="stylesheet">
</head>

<body data-base="../../">

    <main class="container py-5">
        <div id="alerta" aria-live="polite"></div>

        <article id="guia" class="d-none">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card tarjeta p-4">
                        <small id="juego" class="text-muted"></small>
                        <h1 id="titulo" class="mt-1"></h1>
                        <p class="text-muted small">
                            Por <strong id="autor"></strong> · <span id="fecha"></span> · <span id="vistas"></span> vistas
                        </p>
                        <div class="mb-3">
                            <span id="categoria" class="badge bg-secondary"></span>
                            <span id="dificultad" class="badge"></span>
                            <span id="estado"></span>
                        </div>

                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <button id="botonVotar" class="btn btn-outline-secondary" aria-pressed="false"></button>
                            <button id="botonFavorito" class="btn btn-outline-secondary" aria-pressed="false"></button>
                            <button id="botonCompartir" class="btn btn-outline-secondary">Compartir</button>
                            <button id="botonReportar" class="btn btn-outline-danger ms-auto">Reportar</button>
                        </div>

                        <div id="contenido" class="texto-guia"></div>

                        <div id="accionesAutor" class="d-none border-top pt-3 mt-4 d-flex gap-2">
                            <a id="editar" class="btn btn-outline-secondary">Editar</a>
                            <button id="botonEliminar" class="btn btn-outline-danger">Eliminar</button>
                        </div>
                        <button id="botonEliminarModerador" class="btn btn-danger mt-4 d-none align-self-start">Eliminar guía (moderación)</button>
                    </div>
                </div>

                <div class="col-lg-4">
                    <section class="card tarjeta p-4" aria-labelledby="tituloComentarios">
                        <h2 id="tituloComentarios" class="h5">Comentarios (<span id="totalComentarios">0</span>)</h2>
                        <div id="listaComentarios" class="mb-3"></div>
                        <div id="alertaComentario" aria-live="polite"></div>
                        <form id="formComentario">
                            <label for="textoComentario" class="form-label visually-hidden">Escribe un comentario</label>
                            <textarea id="textoComentario" class="form-control mb-2" rows="3" maxlength="1000" placeholder="Escribe un comentario..." required></textarea>
                            <button type="submit" class="btn btn-primario btn-sm">Comentar</button>
                        </form>
                    </section>
                </div>
            </div>
        </article>
    </main>

    <div class="modal fade" id="modalReporte" tabindex="-1" aria-labelledby="tituloReporte" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="formReporte" class="modal-content" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5" id="tituloReporte">Reportar contenido</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="alertaReporte"></div>
                    <label for="motivo" class="form-label">¿Por qué lo reportas?</label>
                    <select id="motivo" class="form-select" required>
                        <option value="">Elige un motivo</option>
                        <option>Spam o publicidad</option>
                        <option>Lenguaje ofensivo</option>
                        <option>Información falsa o engañosa</option>
                        <option>Contenido copiado</option>
                        <option>Otro</option>
                    </select>
                    <div class="invalid-feedback">Elige un motivo.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Enviar reporte</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/guias-comun.js"></script>
    <script src="../../js/guia.js"></script>
</body>

</html>
