<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Explorar guías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link href="../../css/styles.css" rel="stylesheet">
</head>

<body class="fondo-steam" data-base="../../" data-roles="usuario,moderador,admin">

    <main class="container py-5">
        <div id="cabeceraTips" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="mb-0">Explorar guías</h1>
            <a href="guia-form.html" id="botonCrear" class="btn btn-primario">+ Crear guía</a>
        </div>

        <div id="alerta" aria-live="polite"></div>

        <div class="card tarjeta p-3 mb-4">
            <div class="row g-2">
                <div class="col-12 col-lg-4">
                    <label for="buscador" class="form-label small mb-1">Buscar</label>
                    <input type="search" id="buscador" class="form-control" placeholder="Palabra clave...">
                </div>
                <div class="col-12 col-sm-6 col-lg-2">
                    <label for="filtroJuego" class="form-label small mb-1">Juego</label>
                    <input type="search" id="filtroJuego" class="form-control" placeholder="Ej. Minecraft">
                </div>
                <div class="col-6 col-lg-2">
                    <label for="filtroCategoria" class="form-label small mb-1">Categoría</label>
                    <select id="filtroCategoria" class="form-select"></select>
                </div>
                <div class="col-6 col-lg-2">
                    <label for="filtroDificultad" class="form-label small mb-1">Dificultad</label>
                    <select id="filtroDificultad" class="form-select"></select>
                </div>
                <div class="col-12 col-sm-6 col-lg-2">
                    <label for="orden" class="form-label small mb-1">Ordenar por</label>
                    <select id="orden" class="form-select">
                        <option value="recientes">Más recientes</option>
                        <option value="antiguas">Más antiguas</option>
                        <option value="votadas">Más votadas</option>
                        <option value="vistas">Más vistas</option>
                        <option value="titulo">Título (A-Z)</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <small id="totalResultados" class="text-muted"></small>
                <button id="limpiarFiltros" class="btn btn-link btn-sm p-0">Limpiar filtros</button>
            </div>
        </div>

        <div id="listaTips" class="row g-4"></div>
        <section id="sinResultados" class="panel-vacio d-none">
            <h2 class="h5 mb-1">No encontramos guías con esa búsqueda</h2>
            <p class="text-muted mb-3">Sé el primero en crearla, o empieza con uno de los juegos más jugados:</p>
            <div id="sugerenciasVacio" class="sugerencias-vacio"></div>
            <a href="guia-form.html" class="btn btn-primario boton-personalizada mt-3">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12.15.85a1.5 1.5 0 0 1 2.12 0l.88.88a1.5 1.5 0 0 1 0 2.12L5.5 13.5 1.5 14.5l1-4L12.15.85zM11.5 3 13 4.5"/></svg>
                Crear guía personalizada
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/guias-comun.js"></script>
    <script src="../../js/juegos.js"></script>
    <script src="../../js/tips.js"></script>
</body>

</html>
