<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Crear guía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/styles.css" rel="stylesheet">
</head>

<body data-base="../../" data-roles="usuario,moderador,admin">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card tarjeta p-4">
                    <h1 id="tituloPagina" class="h3 mb-4">Crear guía</h1>

                    <div id="alerta" aria-live="polite"></div>

                    <form id="formGuia" novalidate>
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required minlength="5" maxlength="120" placeholder="Ej. Cómo vencer al primer jefe">
                            <div class="invalid-feedback">Escribe un título (5 a 120 caracteres).</div>
                        </div>

                        <div class="mb-3">
                            <label for="juego" class="form-label">Juego</label>
                            <input type="text" class="form-control" id="juego" required maxlength="60" placeholder="Ej. Elden Ring">
                            <div class="invalid-feedback">Escribe el nombre del juego.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-select" required></select>
                                <div class="invalid-feedback">Elige una categoría.</div>
                            </div>
                            <div class="col-sm-6">
                                <label for="dificultad" class="form-label">Dificultad</label>
                                <select id="dificultad" class="form-select" required></select>
                                <div class="invalid-feedback">Elige una dificultad.</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="contenido" class="form-label">Contenido</label>
                            <textarea id="contenido" class="form-control" rows="12" required minlength="20" placeholder="Explica paso a paso..."></textarea>
                            <div class="d-flex justify-content-between">
                                <div class="invalid-feedback">Escribe al menos 20 caracteres.</div>
                                <small id="contador" class="text-muted ms-auto">0 caracteres</small>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="botonGuardar" class="btn btn-primario">Publicar guía</button>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/guias-comun.js"></script>
    <script src="../../js/guia-form.js"></script>
</body>

</html>
