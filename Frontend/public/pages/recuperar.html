<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes | Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body data-base="../" data-roles="visitante">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card tarjeta p-4">
                    <h1 class="h3 text-center mb-4">Recuperar contraseña</h1>

                    <div id="alerta" aria-live="polite"></div>

                    <p class="text-muted">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>

                    <form id="formRecuperar" novalidate>
                        <div class="mb-4">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" autocomplete="email" required>
                            <div class="invalid-feedback">Escribe un correo válido.</div>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Enviar enlace</button>
                    </form>

                    <p class="text-center mt-3 mb-0"><a href="login.html">Volver a iniciar sesión</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/recuperar.js"></script>
</body>

</html>
