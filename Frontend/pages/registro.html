<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGuides | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body data-base="../" data-roles="visitante">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card tarjeta p-4">
                    <h1 class="h3 text-center mb-4">Crear cuenta</h1>

                    <div id="alerta"></div>

                    <form id="formRegistro" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required minlength="3">
                            <div class="invalid-feedback">Escribe tu nombre (mínimo 3 letras).</div>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" required>
                            <div class="invalid-feedback">Escribe un correo válido.</div>
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="clave" required minlength="6">
                            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmar" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmar" required>
                            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Registrarme</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/registro.js"></script>
</body>

</html>
